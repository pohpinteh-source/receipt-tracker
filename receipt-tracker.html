<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Receipt Tracker</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:15px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
}

h1{
    text-align:center;
    color:#003366;
}

button{
    width:100%;
    height:60px;
    border:none;
    border-radius:10px;
    font-size:20px;
    cursor:pointer;
}

.capture{
    background:#0078d7;
    color:white;
}

.submit{
    background:green;
    color:white;
    margin-top:10px;
}

.clear{
    background:#666;
    color:white;
    margin-top:10px;
}

input,select{
    width:100%;
    padding:15px;
    font-size:18px;
    margin-top:5px;
    box-sizing:border-box;
}

.preview{
    width:100%;
    max-height:300px;
    object-fit:contain;
    display:none;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Receipt Tracker</h1>

<button
class="capture"
onclick="document.getElementById('photo').click()">

📷 Capture Receipt

</button>

<input
id="photo"
type="file"
accept="image/*"
capture="environment"
style="display:none">

<br><br>

<img
id="preview"
class="preview">

<br><br>

<label>Date</label>
<input type="date" id="date">

<br><br>

<label>Category</label>
<select id="category">

<option>Medical</option>
<option>Lifestyle</option>
<option>Education</option>
<option>Book/Magazine</option>
<option>Sport</option>
<option>Others</option>

</select>

<br><br>

<label>Amount (RM)</label>
<input
id="amount"
type="number"
step="0.01">

<button
class="submit"
onclick="submitReceipt()">

SUBMIT RECEIPT

</button>

<button
class="clear"
onclick="clearForm()">

CLEAR FORM

</button>

</div>

</div>

<script>

document.getElementById("date").value =
new Date().toISOString().split("T")[0];

document
.getElementById("photo")
.addEventListener("change",function(e){

const file=e.target.files[0];

if(file){

const reader =
new FileReader();

reader.onload=function(ev){

document.getElementById(
"preview"
).src=ev.target.result;

document.getElementById(
"preview"
).style.display="block";

};

reader.readAsDataURL(file);

}

});

function clearForm(){

document.getElementById(
"photo"
).value="";

document.getElementById(
"preview"
).src="";

document.getElementById(
"preview"
).style.display="none";

document.getElementById(
"date"
).value =
new Date().toISOString().split("T")[0];

document.getElementById(
"category"
).selectedIndex=0;

document.getElementById(
"amount"
).value="";

}

function submitReceipt(){

alert(
"Submit function test successful"
);

}

</script>

</body>
</html>
