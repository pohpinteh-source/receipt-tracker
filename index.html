<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Receipt Tracker</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:0;
    padding:15px;
    background:#f4f4f4;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
}

h1{
    text-align:center;
    color:#003366;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

input,
select{
    width:100%;
    padding:15px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
    margin-top:5px;
}

button{
    width:100%;
    height:60px;
    border:none;
    border-radius:10px;
    font-size:20px;
    cursor:pointer;
}

.capture{
    background:#0078d7;
    color:white;
}

.save{
    background:green;
    color:white;
    margin-top:10px;
}

.export{
    background:orange;
    color:white;
    margin-top:10px;
}
.action-btn{
    width:auto;
    height:35px;
    font-size:14px;
    padding:5px 10px;
    margin-right:5px;
    border:none;
    border-radius:5px;
    color:white;
}

.edit-btn{
    background:#0078d7;
}

.delete-btn{
    background:red;
}
.preview{
    width:100%;
    max-height:300px;
    object-fit:contain;
    display:none;
    margin-top:10px;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

.summary-card{
    background:#f7f7f7;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    text-align:center;
}
.clear-btn{
    background:#666666;
    color:white;
    margin-top:10px;
}

.total{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#003366;
    margin-top:10px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0078d7;
    color:white;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
}

</style>
</head>

<body>

<div class="container">

<h1>Receipt Tracker</h1>
<div class="subtitle">
Capture, Store & Track Your Receipts
</div>

<div class="card">

<button class="capture"
onclick="document.getElementById('photo').click()">
📷 Capture Receipt
</button>

<input
type="file"
id="photo"
accept="image/*"
capture="environment"
style="display:none">

<img id="preview" class="preview">

<br><br>

<label>Date</label>
<input type="date" id="date">

<br><br>

<label>Category</label>
<select id="category">
<option>Medical</option>
<option>Lifestyle</option>
<option>Education</option>
<option>Book/Magazine</option>
<option>Sport</option>
<option>Others</option>
</select>

<br><br>

<label>Amount (RM)</label>
<input type="number" id="amount" step="0.01">

<button class="save" onclick="saveReceipt()">
SUBMIT RECEIPT
</button>

<button
class="clear-btn"
onclick="clearForm()">
CLEAR FORM
</button>

</div>

<div class="card">

<h3>Year Filter</h3>

<input
type="number"
id="yearFilter"
list="yearList"
value=""
placeholder="Type Year or Select"
oninput="refreshDisplay()">

<datalist id="yearList"></datalist>

</div>

<div class="card">

<h3>Summary Dashboard</h3>

<div id="summaryCards" class="summary-grid"></div>

<div id="totalAmount" class="total">
TOTAL : RM 0.00
</div>

</div>

<div class="card">

<h3>Receipt Records</h3>

<table>

<thead>
<tr>
<th>Date</th>
<th>Category</th>
<th>Amount</th>
<th>File Name</th>
<th>Action</th>
</tr>

</thead>

<tbody id="receiptTable"></tbody>

</table>

<button class="export" onclick="exportCSV()">
EXPORT CSV
</button>

<button
class="export"
onclick="window.open('https://docs.google.com/spreadsheets/d/10K1N4S3FlXHMtFcuZq2CRY00SJ3ZyJGxXe-ClKkophg/edit')">

OPEN GOOGLE SHEET

</button>

</div>

</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyquOtg8CGwCXWGF2-H7PLqxMh6CelwEOsyS9K-u8ZKNN9VIuNtfVaKGZDS11o684dEGw/exec";


const categories=[
"Medical",
"Lifestyle",
"Education",
"Book/Magazine",
"Sport",
"Others"
];

let receipts=
JSON.parse(localStorage.getItem("receipts")) || [];

document.getElementById("date").value=
new Date().toISOString().split("T")[0];
document.getElementById("yearFilter").value =
new Date().getFullYear();


for(let y=2025;y<=2100;y++){

 let option=document.createElement("option");
 option.value=y;

 document
 .getElementById("yearList")
 .appendChild(option);

}

document
.getElementById("photo")
.addEventListener("change", function(e){

    let file = e.target.files[0];

    if(file){

        let reader = new FileReader();

        reader.onload = function(ev){

            let img =
            document.getElementById("preview");

            img.src = ev.target.result;
            img.style.display = "block";

        };

        reader.readAsDataURL(file);

    }

});


function saveReceipt(){

    const file =
    document.getElementById("photo").files[0];

    if(!file){

        alert("Please capture receipt photo first");
        return;

    }

    const date =
    document.getElementById("date").value;

    const category =
    document.getElementById("category").value;

    const amount =
    document.getElementById("amount").value;

    if(!amount){

        alert("Please enter Amount");
        return;

    }

    const reader =
    new FileReader();

    reader.onload = function(){

        const image =
        reader.result.split(",")[1];

fetch(SCRIPT_URL,{

    method:"POST",

    body:JSON.stringify({

        action:"saveReceipt",

        date:date,
        category:category,
        amount:amount,
        image:image

    })

})
.then(r => r.json())
.then(result => {

    if(result.success){

        receipts.push({

            id:Date.now(),
            date:date,
            category:category,
            amount:parseFloat(amount),
            fileName:result.fileName

        });

        localStorage.setItem(
            "receipts",
            JSON.stringify(receipts)
        );

        refreshDisplay();

        alert(
            "Receipt Submitted Successfully"
        );

        clearForm();

    }
    else{

        alert(
            "Error\n\n" +
            result.error
        );

    }

})
.catch(err => {

    alert(
        "Connection Error\n\n" +
        err
    );

});
    };

    reader.readAsDataURL(file);

}



function clearForm(){

    document.getElementById("photo").value = "";

    document.getElementById("preview").src = "";

    document.getElementById("preview").style.display =
    "none";

    document.getElementById("date").value =
    new Date().toISOString().split("T")[0];

    document.getElementById("category").selectedIndex = 0;

    document.getElementById("amount").value = "";

}
function refreshDisplay(){

 const year=
 document.getElementById("yearFilter").value;

 const filtered=
 receipts.filter(r=>
 new Date(r.date).getFullYear()==year
 );

 let html="";
 let total=0;

 categories.forEach(cat=>{

  const rows=
  filtered.filter(r=>r.category===cat);

  const count=
  rows.length;

  const sum=
  rows.reduce(
  (a,b)=>a+b.amount,
  0);

  total+=sum;

  html+=`
  <div class="summary-card">
  <b>${cat}</b><br>
  ${count} Receipt(s)<br>
  RM ${sum.toFixed(2)}
  </div>
  `;

 });

 document.getElementById(
 "summaryCards"
 ).innerHTML=html;

 document.getElementById(
 "totalAmount"
 ).innerHTML=
 "TOTAL : RM " +
 total.toFixed(2);

 let rows="";

 filtered.forEach(r=>{

rows+=`
<tr>
<td>${r.date}</td>
<td>${r.category}</td>
<td>RM ${r.amount.toFixed(2)}</td>
<td>${r.fileName || "-"}</td>
<td>

<button
class="action-btn edit-btn"
onclick="editReceipt(${r.id})">
Edit
</button>

<button
class="action-btn delete-btn"
onclick="deleteReceipt(${r.id})">
Delete
</button>

</td>
</tr>
`;
 });

 document.getElementById(
 "receiptTable"
 ).innerHTML=rows;

}

function exportCSV(){

let csv=
"Date,Category,Amount,File Name\n";


 receipts.forEach(r=>{

  csv+=
`${r.date},${r.category},${r.amount},${r.fileName}\n`

 });

 let blob=
 new Blob([csv],
 {type:"text/csv"});

 let link=
 document.createElement("a");

 link.href=
 URL.createObjectURL(blob);

 link.download=
 "ReceiptTracker.csv";

 link.click();

}
function deleteReceipt(id){

    if(!confirm("Delete this receipt?")){
        return;
    }

    receipts =
    receipts.filter(
        r => r.id !== id
    );

    localStorage.setItem(
        "receipts",
        JSON.stringify(receipts)
    );

    refreshDisplay();
}

function editReceipt(id){

    const r =
    receipts.find(
        x => x.id === id
    );

    if(!r) return;

    document.getElementById("date").value =
    r.date;

    document.getElementById("category").value =
    r.category;

    document.getElementById("amount").value =
    r.amount;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

refreshDisplay();

</script>

</body>
</html>
